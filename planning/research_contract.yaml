question: "JEPA 如何从联合嵌入空间预测发展为图像表示、视频动态、动作条件世界模型与闭环控制路线？不同路线的直接证据、适用边界和未解决问题是什么？"
objects: "Joint Embedding Predictive Architectures（JEPA）及少量对其定义、对照或应用边界不可替代的相邻工作"
tasks: "自监督表示学习、图像/视频表征、时空预测、动作条件世界建模、机器人规划与控制、多模态嵌入预测"
contexts: "研究人员与具备机器学习基础的专业读者；以视觉和具身智能为主，纳入跨域工作用于谱系和边界说明"
mechanism_scope: "上下文编码器/目标编码器、联合嵌入空间、遮挡或时间上下文、潜在目标预测、目标编码器更新、动作条件潜在动力学、规划/控制接口；不将像素重建或纯对比学习自动视为 JEPA"
outcomes: "表示质量、线性/下游迁移、时空预测能力、动作条件预测、规划或控制成功率、计算/数据效率、分布外与失败边界"
time_window: "奠基工作至 2026-08-12"
languages: ["英文", "中文"]
source_families: ["正式会议与期刊论文页或 DOI", "arXiv 与 OpenReview 稳定入口", "作者或机构项目页", "官方代码与数据仓库"]
publication_statuses: ["同行评议", "预印本", "官方报告"]
must_cover_axes: ["源流与目标函数", "图像表示", "视频与时空", "动作条件世界模型", "多模态与跨域", "评测、反证与安全", "时间线"]
exclusions: ["仅词面包含 JEPA 且不预测嵌入/潜在表示的工作", "单纯像素重建、扩散生成或对比学习且未与 JEPA 目标建立直接关系的工作", "无法定位一手论文/官方技术报告/作者项目页的二手摘要", "截止日期后的版本", "与 Joint Embedding Predictive Architecture 无关的同名缩写"]
cutoff_date: "2026-08-12"
target_level: "L2"
current_level: "L2"
primary_routes: ["理论与目标函数", "图像表示", "视频与时空", "动作条件与控制", "多模态与跨域", "评测与反证"]
ordered_levels: ["架构原则", "静态表征", "无动作时空动力学", "动作条件动力学", "闭环规划与控制"]
comprehensiveness_definition: "在冻结范围内完成发现、核验、反证、补漏四轮；每条主路线覆盖奠基或代表、前沿、评测或反证位置；完成前后向引用追踪、两轮低于 5% 的边际新增检查、核心条目深读与主张审计。"
known_long_tail: "题名未使用 JEPA 但目标函数相近的潜在预测工作、非英文区域性成果、2026 年临近截止日的新预印本，以及仅在应用论文正文中短暂采用 JEPA 的长尾。"
